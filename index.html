<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Broker Console Demo</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a2b4c'/%3E%3Crect x='8' y='14' width='16' height='12' fill='none' stroke='%23e07a2c' stroke-width='2'/%3E%3Cline x1='16' y1='6' x2='16' y2='14' stroke='%23e07a2c' stroke-width='2'/%3E%3C/svg%3E">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.webgpu.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">Broker Console</div>
    <div class="topbar-actions">
      <span class="icon-btn" title="Notifications">&#128276;</span>
      <span class="user-menu">Loïc Dupont &#9662;</span>
    </div>
  </header>

  <div class="layout">
    <main class="main-column">
      <h1>Parameters</h1>

      <section class="form-section">
        <h2>Base block</h2>
        <div class="field-grid">
          <label>A &mdash; width (m) <input type="number" id="input-A" min="0.1" max="2" step="0.01"></label>
          <label>B &mdash; depth (m) <input type="number" id="input-B" min="0.1" max="2" step="0.01"></label>
          <label class="field-span-2">H1 &mdash; height (m) <input type="number" id="input-H1" min="0.05" max="2" step="0.01"></label>
        </div>
      </section>

      <section class="form-section">
        <h2>Raised back wall</h2>
        <div class="field-grid">
          <label>A2 &mdash; width (m) <input type="number" id="input-A2" min="0.02" max="2" step="0.01"></label>
          <label>H2 &mdash; height (m) <input type="number" id="input-H2" min="0.05" max="2" step="0.01"></label>
        </div>
      </section>

      <section class="form-section">
        <h2>Reinforcement</h2>
        <div class="field-grid">
          <label>Nb &mdash; bar count <input type="number" id="input-Nb" min="0" max="12" step="1"></label>
          <label>Db &mdash; bar dia. (m) <input type="number" id="input-Db" min="0.006" max="0.06" step="0.002"></label>
          <label>Sb &mdash; pitch (m) <input type="number" id="input-Sb" min="0.02" max="0.4" step="0.005"></label>
          <label>Cb &mdash; cover (m) <input type="number" id="input-Cb" min="0.005" max="0.2" step="0.005"></label>
          <label>Lh &mdash; hook depth (m) <input type="number" id="input-Lh" min="0" max="0.5" step="0.005"></label>
          <label>Lt &mdash; hook tail (m) <input type="number" id="input-Lt" min="0" max="0.5" step="0.005"></label>
        </div>
      </section>
    </main>

    <aside class="right-rail">
      <div class="validation-chips">
        <span class="chip chip-ok">Base block &#10003;</span>
        <span class="chip chip-ok">Back wall &#10003;</span>
        <span class="chip chip-ok">Reinforcement &#10003;</span>
      </div>

      <div class="diagram-panel">
        <div class="diagram-toggle">
          <button id="view-toggle-2d" class="toggle-btn active">2D</button>
          <button id="view-toggle-3d" class="toggle-btn">3D</button>
        </div>
        <div id="diagram-thumbnail" class="diagram-container"></div>
        <button id="expand-diagram-btn" class="expand-btn">Enlarge diagram</button>
      </div>

      <div class="warning-callout">
        Check the parameters before final validation.
      </div>

      <div id="result-rows" class="result-rows"></div>
    </aside>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Enlarge diagram</h2>
        <button id="modal-close-btn" class="close-btn" aria-label="Close">&times;</button>
      </div>
      <div class="diagram-toggle">
        <button id="modal-view-toggle-2d" class="toggle-btn active">2D</button>
        <button id="modal-view-toggle-3d" class="toggle-btn">3D</button>
      </div>
      <div id="modal-diagram-container" class="diagram-container modal-diagram-container"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/modal.js"></script>
</body>
</html>
